# Render "Blueprint": lets Render read this file and set up the backend service automatically
# when you connect the repo (New + > Blueprint, instead of New + > Web Service).
# Variables marked sync: false are secrets - Render will ask you to type them in once, in the
# dashboard, rather than storing them in this file.
services:
  - type: web
    name: itech-broadcast-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: APP_PUBLIC_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: ALLOWED_EMAIL_DOMAIN
        value: ""
      - key: MAIL_ENABLED
        value: "false"
