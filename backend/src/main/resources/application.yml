spring:
  application:
    name: campusconnect
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jpa:
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  mail:
    # Set SPRING_MAIL_HOST / SPRING_MAIL_PORT / SPRING_MAIL_USERNAME / SPRING_MAIL_PASSWORD
    # and MAIL_ENABLED=true to send real emails. Without a host, emails are only logged.
    port: 587
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

server:
  port: ${PORT:8080}
  error:
    include-message: always

app:
  jwt:
    # 32+ characters. ALWAYS override with JWT_SECRET in production.
    secret: ${JWT_SECRET:dev-only-secret-change-me-please-0123456789}
    expiration-hours: 24
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
  public-url: ${APP_PUBLIC_URL:http://localhost:5173}
  # Optional: only accept sign-up emails from this domain, e.g. your college's. Blank = any email.
  allowed-email-domain: ${ALLOWED_EMAIL_DOMAIN:}
  club-name: iTech Broadcast
  admin:
    username: ${ADMIN_USERNAME:admin@broadcast}
    password: ${ADMIN_PASSWORD:itechbroadcast}
    name: iTech Broadcast Coordinator
  points:
    target: 20
  storage:
    dir: ${STORAGE_DIR:./uploads}
  mail:
    enabled: ${MAIL_ENABLED:false}
    from: ${MAIL_FROM:no-reply@campusconnect.local}
  attendance:
    enforce-window: ${ATTENDANCE_ENFORCE_WINDOW:true}
    opens-minutes-before: 60
    closes-minutes-after: 30

management:
  endpoints:
    web:
      exposure:
        include: health

springdoc:
  swagger-ui:
    path: /swagger-ui.html
